<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb703">
<title>小星星学习乐园 · 二年级上册</title>
<style>
:root{
  --bg:#fff8e7;--card:#ffffff;--ink:#2b2d42;--muted:#6c757d;
  --yw:#ff6b6b;--yw2:#ffe3e3;--sx:#4dabf7;--sx2:#e3f2fd;--dd:#40c057;--dd2:#e6fcf5;--kx:#9775fa;--kx2:#f3f0ff;
  --ok:#2fbf71;--ok2:#e3f9ec;--bad:#ff8c42;--bad2:#fff1e6;--star:#ffb703;
  --r:22px;--shadow:0 6px 0 rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.08);
  --fs:clamp(18px,2.6vmin,26px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;font-size:var(--fs);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","AR PL UKai CN","Noto Serif CJK SC",serif}
.py{font-family:"Arial Rounded MT Bold","Helvetica Neue",Arial,"Noto Sans",sans-serif}
#app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{flex:1;margin:0;font-size:1.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--card);border-radius:18px;padding:12px 20px;box-shadow:var(--shadow);font-weight:700;min-height:56px;min-width:56px;transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.pri{background:var(--star);color:#3d2c00}
.btn.blue{background:var(--sx);color:#fff}
.btn.red{background:var(--yw);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:8px 18px 24px}
.hero{text-align:center;margin:6px 0 14px}
.hero .t{font-size:1.9em;font-weight:900;letter-spacing:2px}
.hero .s{color:var(--muted);margin-top:4px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.subj{border-radius:30px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;color:#fff;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.subj .ic{font-size:3.6em;line-height:1}
.subj .nm{font-size:2em;font-weight:900;letter-spacing:6px}
.subj .ds{opacity:.95;font-size:.9em}
.subj.yw{background:linear-gradient(160deg,#ff8787,#fa5252)}
.subj.sx{background:linear-gradient(160deg,#74c0fc,#339af0)}
.bar{height:14px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;width:80%;margin-top:6px}
.bar>i{display:block;height:100%;background:#fff;border-radius:9px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.row .btn{flex:1;min-width:200px;font-size:1.05em}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mi{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);text-align:left;display:flex;gap:14px;align-items:center;min-height:100px}
.mi .ic{font-size:2.2em;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.mi b{display:block;font-size:1.1em}
.mi small{color:var(--muted);font-size:.78em}
.yw .mi .ic{background:var(--yw2)} .sx .mi .ic{background:var(--sx2)}
.sec{font-weight:900;margin:22px 4px 10px;font-size:1.05em}
.seg{display:inline-flex;background:#fff;border-radius:16px;padding:5px;box-shadow:var(--shadow);gap:4px;flex-wrap:wrap}
.seg button{background:transparent;border-radius:12px;padding:10px 18px;font-weight:800;min-height:48px}
.seg button.on{background:var(--star);color:#3d2c00}
.opts-line{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 4px}
/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.prog{display:flex;align-items:center;gap:12px}
.prog .track{flex:1;height:18px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.prog .track i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ffb703);border-radius:10px;transition:width .3s}
.qcard{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:22px;text-align:center;position:relative;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qcard .tip{color:var(--muted);font-size:.95em}
.qbig{font-size:5.2em;font-weight:800;line-height:1.15}
.qmid{font-size:3.4em;font-weight:800;line-height:1.2}
.qeq{font-size:3.3em;font-weight:900;letter-spacing:2px}
.qeq .ans{display:inline-block;min-width:1.6em;border-bottom:6px solid var(--star);color:var(--sx)}
.spk{position:absolute;top:14px;right:14px;width:68px;height:68px;border-radius:50%;background:var(--star);font-size:1.7em;box-shadow:var(--shadow)}
.spk:disabled{opacity:.3}
.retry-tag{position:absolute;top:16px;left:16px;background:var(--bad2);color:#c2410c;border-radius:12px;padding:4px 12px;font-size:.8em;font-weight:800}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ch{background:#fff;border-radius:24px;box-shadow:var(--shadow);min-height:110px;font-size:2.4em;font-weight:800;padding:10px;border:4px solid transparent;transition:transform .08s}
.ch.small{font-size:1.6em}
.ch:active{transform:scale(.97)}
.ch.right{background:var(--ok2);border-color:var(--ok);animation:pop .5s}
.ch.wrong{background:var(--bad2);border-color:var(--bad);animation:shake .4s}
.ch:disabled{cursor:default}
.feedback{min-height:64px;border-radius:20px;padding:12px 18px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:1.05em;visibility:hidden}
.feedback.show{visibility:visible}
.feedback.ok{background:var(--ok2);color:#137a45}
.feedback.bad{background:var(--bad2);color:#b45309}
.feedback .msg{flex:1}
.feedback .btn{min-height:52px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{background:#fff;border-radius:20px;box-shadow:var(--shadow);font-size:1.9em;font-weight:900;min-height:76px}
.pad button:active{transform:translateY(3px)}
.pad .ok{background:var(--ok);color:#fff;font-size:1.3em}
.pad .del{background:#ffe8cc;font-size:1.3em}
@media (orientation:landscape) and (min-width:900px){
  .qwrap{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
  .qcard{min-height:330px}
  .pad button{min-height:70px}
}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.float-star{position:fixed;font-size:3.2em;pointer-events:none;z-index:50;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-80%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
.explain{margin-top:6px;font-size:1.05em;color:#495057}
.explain b{color:var(--ink)}
/* summary */
.sum{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:30px;text-align:center}
.sum .big{font-size:4em}
.sum .stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:16px 0}
.sum .st{background:var(--bg);border-radius:20px;padding:14px 24px;min-width:150px}
.sum .st b{display:block;font-size:2em}
.confetti{position:fixed;top:-40px;font-size:2em;pointer-events:none;z-index:40;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* browse */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.zc{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px 6px;text-align:center}
.zc .p{font-size:.95em;color:#e8590c;font-weight:700}
.zc .z{font-size:2.6em;line-height:1.2}
.zc .w{font-size:.8em;color:var(--muted)}
.pyc{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px 4px;text-align:center}
.pyc .p{font-size:1.7em;font-weight:900}
.pyc .w{font-size:.75em;color:var(--muted)}
.grid-py{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.kj{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.kj button{background:#fff;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.08);padding:6px 2px;min-height:62px;line-height:1.25}
.kj button .a{font-size:min(2.15vw,21px);font-weight:900;white-space:nowrap}
.kj button .b{font-size:.7em;color:var(--muted)}
.kj .empty{visibility:hidden}
.kj button.hl{background:#fff3bf}
/* stickers */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.stk .s{background:#fff;border-radius:22px;box-shadow:var(--shadow);text-align:center;padding:14px 6px}
.stk .s .e{font-size:3em}
.stk .s.lock .e{filter:grayscale(1);opacity:.25}
.stk .s small{display:block;color:var(--muted);font-size:.75em}
/* parent */
.panel{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:.9em}
td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left}
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.dialog{background:#fff;border-radius:30px;padding:26px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h2{margin:4px 0 10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2b2d42;color:#fff;padding:12px 22px;border-radius:16px;z-index:70;font-size:.9em;max-width:90%}
.note{color:var(--muted);font-size:.8em}
@media (orientation:portrait) and (min-width:641px){.ch{min-height:150px}.qcard{min-height:300px}.pad button{min-height:96px}}
@media (max-width:640px){.subjects,.menu{grid-template-columns:1fr}.subj{min-height:180px}.qbig{font-size:4em}.kj{grid-template-columns:repeat(4,1fr)}}
@media (orientation:landscape) and (max-height:800px){.subj{min-height:220px}.hero{margin:0 0 10px}.qbig{font-size:4.6em}}
/* ===== v2 ===== */
.center{text-align:center}.m0{margin-top:0}.mt{margin-top:12px}.s24{font-size:2.4em!important}.big1{font-size:1.4em}.big2{font-size:1.2em}
.opts-line.cc{justify-content:center;margin:12px 0}
.btn.big{font-size:1.25em;padding:16px 40px;min-height:68px;margin-top:6px}
.btn.small-btn{min-height:44px;padding:8px 16px;font-size:.85em;margin-top:8px}
.ulist{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.uc{background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;min-height:118px}
.uc .uno{flex:none;width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:900;color:#fff}
.yw .uc .uno{background:var(--yw)}.sx .uc .uno{background:var(--sx)}
.uc.exam{background:#fff9db;border:3px dashed var(--star)}.uc.exam .uno{background:var(--star)!important;color:#3d2c00}
.uc .ub{flex:1;min-width:0}.uc .ub b{display:block;font-size:1.05em}.uc .ub small{display:block;color:var(--muted);font-size:.75em;line-height:1.35;margin-top:2px}
.ubar{height:8px;background:#f1f3f5;border-radius:6px;overflow:hidden;margin:8px 0 6px}.ubar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:.68em;font-weight:800;border-radius:10px;padding:3px 9px}
.tag.good{background:var(--ok2);color:#137a45}.tag.mid{background:#e7f5ff;color:#1864ab}.tag.low{background:var(--bad2);color:#b45309}.tag.gray{background:#f1f3f5;color:#868e96}
.lessons{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}.lessons span{background:#fff;border-radius:12px;padding:5px 12px;font-size:.78em;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#fff;border-radius:20px;padding:6px;box-shadow:var(--shadow);margin-bottom:16px;position:sticky;top:0;z-index:5}
.tabs button{background:transparent;border-radius:14px;min-height:56px;font-weight:900;font-size:1em}
.tabs button.on{background:var(--star);color:#3d2c00}
.kcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:14px;position:relative}
.kcard h3{margin:0 64px 8px 0;font-size:1.1em}.kcard p{margin:0;line-height:1.75;padding-right:8px}
.spk2{position:absolute;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:var(--star);font-size:1.3em}
.kcard.pt{border-left:8px solid var(--star)}.kcard .ex{margin-top:10px;background:var(--bg);border-radius:14px;padding:10px 14px}
.exa{margin-top:8px;color:#137a45;font-size:1.05em}
.qtext{font-size:1.65em;font-weight:800;line-height:1.5;padding:0 40px}
.wp{font-size:1.35em;font-weight:700;line-height:1.6;text-align:left;padding:0 50px 0 6px}
.qeq.small{font-size:2.2em}
.vwrap{display:flex;align-items:center;gap:24px;justify-content:center}
.vt{border-collapse:collapse;font-size:2.6em;font-weight:900;font-family:"Arial Rounded MT Bold",Arial,sans-serif}.vt td{width:1.1em;text-align:center;padding:0 2px;border:0;line-height:1.15}
.vt tr.line td{border-top:5px solid var(--ink);height:6px}
.groups{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:6px 0}.grp{border:3px dashed #adb5bd;border-radius:16px;padding:6px 10px;font-size:1.8em;letter-spacing:2px}
.ruler{width:100%;max-width:560px;height:auto}.grid8{width:100%;max-width:520px;height:auto}
.choices.c1{grid-template-columns:1fr}.choices.c3{grid-template-columns:1fr 1fr 1fr}
.ch.picked{border-color:var(--sx);background:var(--sx2)}
.retry-tag.blue{background:#e7f5ff;color:#1864ab}
.rv{border-top:1px solid #eee;padding:12px 2px}.rvq{font-weight:700}.rva{margin:4px 0;font-size:.92em}.rve{font-size:.85em;color:#495057}
span.bad{color:#d9480f;font-weight:800}span.good{color:#137a45;font-weight:800}
.tscroll{overflow-x:auto}
.sum .st.score b{font-size:3em;color:var(--yw)}
.kj{grid-template-columns:repeat(9,1fr)!important}
.kj button .a{font-size:min(1.9vw,19px)!important}
@media (max-width:640px){.ulist{grid-template-columns:1fr}.tabs button{font-size:.85em}}
@media (orientation:portrait) and (min-width:641px){.ulist{grid-template-columns:1fr 1fr}}
/* v3：道德与法治 / 科学 */
.subj.dd{background:linear-gradient(160deg,#69db7c,#2f9e44)}
.subj.kx{background:linear-gradient(160deg,#b197fc,#7048e8)}
.subj{min-height:200px}
.subj .nm.long{font-size:1.6em;letter-spacing:2px}
.dd .mi .ic{background:var(--dd2)} .kx .mi .ic{background:var(--kx2)}
.dd .uc .uno{background:var(--dd)}.kx .uc .uno{background:var(--kx)}
.ch.long{font-size:1.25em;min-height:76px;line-height:1.35;padding:12px 18px}
.ch.tf{font-size:2em}.ch.tf.ok{color:#2b8a3e}.ch.tf.no{color:#c92a2a}
@media (orientation:landscape) and (max-height:800px){.subj{min-height:170px;padding:16px 14px}.subj .ic{font-size:2.8em}}
@media (orientation:portrait) and (min-width:641px){.ch.long{min-height:84px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
const CN="零一二三四五六七八九";
function kj(a,b){const x=Math.min(a,b),y=Math.max(a,b),p=x*y;let s;
  if(p<10)s="得"+CN[p];else{const t=Math.floor(p/10),u=p%10;s=(t===1?(u?"十":"一十"):CN[t]+"十")+(u?CN[u]:"");}
  return CN[x]+CN[y]+s;}
const TONES={a:"āáǎà",o:"ōóǒò",e:"ēéěè",i:"īíǐì",u:"ūúǔù","ü":"ǖǘǚǜ"};
function mark(base,t){if(!t)return base;let idx=-1;
  if(base.indexOf("a")>=0)idx=base.indexOf("a");else if(base.indexOf("e")>=0)idx=base.indexOf("e");else if(base.indexOf("ou")>=0)idx=base.indexOf("o");
  else{for(let k=base.length-1;k>=0;k--){if("aoeiuü".indexOf(base[k])>=0){idx=k;break;}}}
  if(idx<0)return base;return base.slice(0,idx)+TONES[base[idx]][t-1]+base.slice(idx+1);}
function parsePy(py){let t=0,b="";for(const ch of py){let f=false;for(const v in TONES){const k=TONES[v].indexOf(ch);if(k>=0){t=k+1;b+=v;f=true;break;}}if(!f)b+=ch;}return {b,t};}
function zhSay(s){return strip(s).replace(/×/g,"乘").replace(/÷/g,"除以").replace(/[＝=]/g,"等于").replace(/[＋+]/g,"加").replace(/[－−]/g,"减").replace(/～|~/g,"到").replace(/（\s*）|（　+）|\(\s*\)/g,"几").replace(/_{2,}/g,"什么").replace(/\bcm\b/g,"厘米").replace(/○/g,"圈");}

/* ================= 存储 ================= */
const KEY="xxx-learn-v1";let mem=null;
function sGet(){try{return localStorage.getItem(KEY);}catch(e){return mem;}}
function sSet(v){try{localStorage.setItem(KEY,v);}catch(e){mem=v;}}
function blank(){return {v:2,stars:0,subj:{yuwen:{rounds:0,ans:0,ok:0},shuxue:{rounds:0,ans:0,ok:0},daofa:{rounds:0,ans:0,ok:0},kexue:{rounds:0,ans:0,ok:0}},units:{},tests:{},modes:{},wrong:[],settings:{limit:20,qn:10,auto:true,rate:0.85,mulRange:"2-9",timed:false},log:[]};}
let D;try{D=JSON.parse(sGet()||"null");}catch(e){D=null;}
if(!D||!D.subj)D=blank();
(function(){const b=blank();for(const k in b)if(D[k]===undefined)D[k]=b[k];for(const s in b.settings)if(D.settings[s]===undefined)D.settings[s]=b.settings[s];for(const s in b.subj)if(!D.subj[s])D.subj[s]=b.subj[s];
  // 旧版错题（按题型规格保存）不兼容新结构，清理
  D.wrong=(D.wrong||[]).filter(w=>w&&w.q);D.v=2;})();
function save(){sSet(JSON.stringify(D));}
function U(id){return D.units[id]||(D.units[id]={ans:0,ok:0,rounds:0,k:0,p:0});}

/* ================= 声音 ================= */
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;let voices=[];
function loadVoices(){if(synth){try{voices=synth.getVoices()||[];}catch(e){voices=[];}}}
if(synth){loadVoices();try{synth.onvoiceschanged=loadVoices;}catch(e){}}
function voiceFor(lang){const l=lang.toLowerCase(),pre=l.split("-")[0];let v=voices.filter(x=>x.lang&&x.lang.toLowerCase().replace("_","-")===l);if(!v.length)v=voices.filter(x=>x.lang&&x.lang.toLowerCase().indexOf(pre)===0);return v[0]||null;}
function speak(text,lang){if(!synth){toast("这台设备暂不支持朗读，请看文字哦");return;}if(!text)return;
  try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||"zh-CN";const v=voiceFor(u.lang);if(v)u.voice=v;u.rate=D.settings.rate||0.85;u.pitch=1.05;synth.speak(u);}catch(e){}}
let actx=null;
function ac(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{actx=new C();}catch(e){return null;}}if(actx.state==="suspended"){try{actx.resume();}catch(e){}}return actx;}
function tone(f,st,du,ty,vo){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.value=f;const t0=c.currentTime+st;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vo||0.25,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+du);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+du+0.05);}

  ["望庐山瀑布［唐］李白","日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。"],
  ["黄山奇石","黄山在安徽省南部，怪石有趣极了：仙桃石、猴子观海、仙人指路、金鸡叫天都，还有天狗望月、狮子抢球、仙女弹琴。"],
  ["日月潭","日月潭是我国台湾省最大的湖。湖中央的小岛把湖水分成两半：北边像圆圆的太阳，叫日潭；南边像弯弯的月亮，叫月潭。"],
  ["葡萄沟","葡萄沟在新疆吐鲁番。七月葡萄成熟，有红的、白的、紫的、淡绿的。晾房里的葡萄能制成葡萄干。"],
  ["语文园地四·日积月累","有山皆图画，无水不文章。白马西风塞上，杏花烟雨江南。清风明月本无价，近水遥山皆有情。雾锁山头山锁雾，天连水尾水连天。"]],

  ["寒号鸟","喜鹊勤劳，早早做窝准备过冬；寒号鸟只知道玩，总说“得过且过”“明天就做窝”，最后在夜里冻死了。做事不能懒惰、拖拉。"],

  ["语文园地五·日积月累","少年不知勤学早，老来方知读书迟。一日读书一日功，一日不读十日空。书山有路勤为径，学海无涯苦作舟。"]],

  "c|班级得到了“文明班级”奖状，这是谁的功劳？|全班同学共同努力的结果|只是班长一个人的功劳|和同学们没关系|班级荣誉靠大家，每个人都出了力。",
  "c|小美画画很好，她可以怎样为班级作贡献？|帮忙出黑板报，布置教室|在同学的书上乱画|只给自己画画|用自己的特长为班级出力，就是作贡献。",
  "c|我们的班级像一个什么？|快乐的大家庭|热闹的菜市场|没有人的空房子|班级是大家庭，同学们一起学习、一起成长。",
  "c|下面哪种做法不对？|把垃圾扫到别的班门口|放学后关好门窗|把桌椅摆整齐|把垃圾扫到别人那里是不对的，要倒进垃圾桶。",

  "t|班级是我们共同的大家庭，同学之间要团结友爱。|团结友爱，班级才会越来越好。",

  "f|值日生刚擦干净的黑板，可以随手乱画。|要爱护值日生的劳动成果。",
  "t|捡起教室地上的一张纸屑，也是为班级作贡献。|为班级作贡献不分大小。",
  "f|班级的桌椅是学校的，弄坏了也没关系。|班级的东西是大家的，要爱护公物。",
  "t|发现班级规则不合理，可以和老师、同学一起商量修改。|规则可以大家一起商量，让它变得更好。",
  "f|只有当班长、得大奖才算为班级作贡献。|贡献不分大小，每个人都能为班级出力。",

  "s|今天轮到你当值日生，可是你很想早点回家玩。你会怎么做？|认真做完值日再回家|偷偷溜走|让别人替你做，自己去玩|值日生要负责任，做完值日再回家。",
  "s|课间，几个同学在教室里追跑，差点撞倒桌子。你可以怎么做？|提醒他们轻声慢步，注意安全|和他们一起追跑|大声骂他们|友好地提醒，大家一起遵守规则。",

{id:"dd3",no:3,name:"第三单元",title:"我的家乡美",
 lessons:["第9课 我爱家乡山和水","第10课 家乡物产养育我","第11课 可亲可敬的家乡人","第12课 家乡新变化"],
 know:[
  ["我爱家乡山和水","每个人都有自己的家乡。家乡有美丽的山、清清的河、广阔的田野或热闹的街道。我们要爱护家乡的环境，不乱扔垃圾，不破坏花草树木。"],
  ["家乡物产养育我","家乡的物产有粮食、蔬菜、水果、特产和手工艺品等。《千人糕》的故事告诉我们：一块小小的米糕，要经过很多人的劳动才能做成。我们要珍惜粮食，不浪费。"],
  ["可亲可敬的家乡人","家乡有很多可敬的人：环卫工人、医生、警察、快递员、农民伯伯……他们辛勤劳动，让大家的生活更美好。见到他们要主动问好、说谢谢，尊重他们的劳动。"],
  ["家乡新变化","家乡的道路变宽了，高楼变多了，公园更美了，出行更方便了。可以问问爷爷奶奶、看看老照片，比一比过去和现在。为家乡的变化感到自豪。"]],
 points:[
  ["千人糕的道理","一样东西要经过很多人的劳动才能做成，要珍惜。","“千人糕”为什么叫这个名字？","因为做成它要经过很多很多人的劳动"],
  ["爱护家乡环境","不乱扔垃圾，不破坏花草树木。","去家乡的河边玩，可以往河里扔垃圾吗？","不可以，要把垃圾带走或扔进垃圾桶"],
  ["尊重劳动者","见到劳动者主动问好，爱护他们的劳动成果。","环卫工人刚扫干净的路面，我们应该怎么做？","不乱扔垃圾，爱护劳动成果"],
  ["了解家乡变化的方法","问长辈、看老照片、实地看一看。","怎样知道家乡过去是什么样子？","问问爷爷奶奶，看看老照片"]],
 bank:[
  "c|《千人糕》的故事告诉我们什么？|一样东西要经过很多人的劳动才能做成|千人糕要一千个人一起吃|糕点越大越好吃|一块米糕从种稻子到做成糕，要经过很多人的劳动。",
  "c|下面哪一项是爱护家乡环境的做法？|把垃圾扔进垃圾桶|在树上刻字|往河里扔塑料瓶|爱护环境，家乡才会更美。",
  "c|下面哪一项属于家乡的物产？|家乡种的水果和粮食|电视里的外国风景|游戏里的宝物|家乡的物产是家乡出产的粮食、水果、特产等。",
  "c|吃饭时，我们应该怎样对待粮食？|吃多少盛多少，不浪费|吃不完就倒掉|用饭粒玩游戏|粮食来之不易，要珍惜。",
  "c|每天早上把街道扫得干干净净的是谁？|环卫工人|消防员|厨师|环卫工人起早贪黑，让街道干净整洁。",
  "c|生病时给我们看病的是谁？|医生|司机|快递员|医生护士帮助我们恢复健康。",
  "c|遇到可亲可敬的家乡人，我们应该怎样做？|主动问好，说声谢谢|视而不见|给他们添麻烦|尊重劳动者，向他们表示感谢。",
  "c|想知道家乡过去的样子，可以怎么做？|问问爷爷奶奶，看看老照片|随便猜一猜|什么都不用做|问长辈、看老照片，就能比较过去和现在。",
  "c|下面哪一项可能是家乡的新变化？|道路变宽了，公园变多了|山都搬走了|太阳变大了|家乡的道路、楼房、公园都在变得更好。",
  "c|一碗米饭是怎么来的？|农民伯伯种出稻谷，再经过加工和运输|从超市里凭空变出来|从树上直接长出米饭|米饭里有农民和很多劳动者的辛苦。",
  "c|“谁知盘中餐，粒粒皆辛苦”提醒我们什么？|要珍惜粮食|要多吃零食|要吃得快一点|这句诗出自《悯农》，提醒我们粮食来之不易。",
  "t|爱护家乡的花草树木，也是热爱家乡的表现。|保护家乡的环境，就是爱家乡。",
  "f|家乡的变化和我们小学生没有关系，不需要关心。|家乡是我们的家，我们要关心家乡的变化。",
  "t|我们吃的、用的东西，很多都凝结着别人的劳动。|就像千人糕一样，要珍惜别人的劳动。",
  "f|环卫工人的工作又脏又累，看不起他们也没关系。|每一种劳动都值得尊重。",
  "t|家乡的特产可以介绍给外地的朋友。|介绍家乡特产，让更多人了解我们的家乡。",
  "f|去公园玩时，可以随手摘花。|花草是大家的，要爱护，不随手摘。",
  "t|警察、快递员、外卖员都在为大家服务，我们要尊重他们。|他们的劳动让生活更方便、更安全。",
  "f|吃不完的饭菜倒掉，不算浪费。|倒掉饭菜就是浪费，要吃多少盛多少。",
  "s|周末去家乡的河边玩，吃完零食后，包装袋怎么处理？|装好带走，扔进垃圾桶|扔进河里|塞进草丛里|垃圾不落地，家乡更美丽。",
  "s|早上上学，你看到环卫工人正在扫地。你可以怎么做？|说一声“您辛苦了”，不乱扔垃圾|把纸扔在刚扫干净的地上|捂着鼻子跑开并嘲笑|尊重劳动者，爱护劳动成果。",
  "s|外地的表哥来你家做客，想了解你的家乡。你可以怎么做？|带他看看家乡的美景，尝尝家乡的特产|说家乡没什么好看的|不理他，自己玩|热情介绍家乡，为家乡自豪。",
  "s|午餐盛得太多吃不完了，你会怎么做？|下次少盛一点，吃多少盛多少|全部倒掉|偷偷藏起来|按需取餐，不浪费粮食。",
  "s|爷爷说，他小时候家乡都是土路，现在变成了宽宽的马路。你有什么感受？|为家乡的变化感到高兴和自豪|觉得和自己没关系|觉得爷爷在讲笑话|家乡越来越好，我们感到自豪。"]},
{id:"dd4",no:4,name:"第四单元",title:"我爱我们的祖国",
 lessons:["第13课 美丽中国我们的家","第14课 我们都是中国人","第15课 红红火火中国年","第16课 祖国，我为您自豪"],
 know:[
  ["美丽中国我们的家","我国的全称是中华人民共和国，首都是北京。北京有天安门广场、故宫、人民大会堂、人民英雄纪念碑。祖国有长长的长江和黄河、高高的山、广阔的草原和辽阔的大海。"],
  ["我们都是中国人","我国是统一的多民族国家，有56个民族，各民族是一家人。不管生活在哪里，我们都是中国人。"],
  ["国家标志","国旗、国歌、国徽和首都是国家的象征和标志。国旗是五星红旗，国歌是《义勇军进行曲》，国徽中间是五星照耀下的天安门，周围是谷穗和齿轮。"],
  ["红红火火中国年","春节是农历新年。人们贴春联、贴福字、吃年夜饭、拜年。春联要从右边开始读。春节已经被列入人类非物质文化遗产。"],
  ["祖国，我为您自豪","我国有优秀的传统文化：二十四节气、武术、剪纸、戏曲、针灸、十二生肖等。也有许多新成就：又快又稳的高铁、我国自己的空间站。"]],
 points:[

  ["国徽图案","中间是五星照耀下的天安门，周围是谷穗和齿轮。","国徽中间是什么图案？","五星照耀下的天安门"],
  ["春联怎么读","春联从右边开始读。","读春联应该从哪边开始？","从右边开始"],
  ["首都北京","我国的首都是北京。","我国的首都是哪座城市？","北京"]],

  "c|春节是什么节日？|农历新年|教师节|国庆节|春节是我国的农历新年。",

  "c|我国有了属于自己的什么，航天员可以在里面生活和工作？|空间站|海底城|月亮上的房子|我国有了自己独立的空间站，还在那里培育了种子。",
  "c|下面哪一个不是中国的传统节日？|圣诞节|春节|中秋节|春节、中秋节是中国的传统节日，圣诞节不是。",

  "s|过年时，奶奶给你压岁钱，你应该怎么说？|谢谢奶奶，祝奶奶身体健康！|就这么一点呀？|什么也不说，拿了就跑|过年拜年要有礼貌，送上祝福。",

  "s|外国小朋友问你中国有什么了不起的。你可以怎么介绍？|介绍高铁、空间站，还有剪纸和武术|说不知道|说中国没什么好介绍的|祖国有优秀的传统文化，也有许多新成就。"]}

{id:"kx1",no:1,name:"第一单元",title:"它们是用什么做的",
 lessons:["1 认识常见材料","2 各种各样的杯子","3 金属"],
 know:[
  ["常见材料","生活中常见的材料有木头、金属、塑料、玻璃、布、纸、陶瓷、橡胶等。一个物体可以用一种材料做，也可以用几种材料做，比如木柄铁锅有木头也有金属。"],
  ["怎样观察材料","用眼睛看：颜色、透不透明；用手摸：光滑还是粗糙，软还是硬；用手掂：轻还是重。不认识的东西不能随便闻、更不能尝。"],
  ["材料的特点决定用途","玻璃透明，用来做窗户；布柔软、透气、能吸水，用来做衣服和毛巾；橡胶有弹性、能防滑，用来做轮胎和鞋底；塑料轻、不易碎、不透水，用来做雨衣和水杯；木头有纹理、比较轻，用来做桌椅和筷子。"],
  ["各种各样的杯子","纸杯轻便、用一次就扔；塑料杯轻、耐摔；玻璃杯透明但容易碎；陶瓷杯光滑、容易清洗；不锈钢杯结实耐用，保温杯能让热水保持很久。要根据需要选择合适的杯子。"],
  ["金属","铁、铜、铝都是金属。金属大多有光泽、比较坚硬、传热快，还能导电。铁锅、钥匙、剪刀、易拉罐都是用金属做的。铁做的东西能被磁铁吸引。"]],
 points:[
  ["材料与用途","材料有什么特点，就适合做什么。","窗户用玻璃做，是因为玻璃怎么样？","透明"],
  ["选择合适的杯子","去户外选轻便不易碎的杯子。","去郊游，带玻璃杯还是塑料杯更合适？","塑料杯，轻便又不容易摔碎"],
  ["金属的特点","有光泽、坚硬、传热快、能导电。","炒菜的锅用金属做，是因为金属怎么样？","传热快"],

const ALLZ=[],WORDS={},RAD={};
YW_UNITS.forEach(u=>{u.Z=u.zi.split(";").map(s=>{const a=s.split(",");return {z:a[0],p:a[1],w:a[2],uid:u.id};});
  u.Z.forEach(x=>{ALLZ.push(x);WORDS[x.w]=1;});u.subj="yuwen";u.title=u.name+"·"+u.type;});
for(const k in RADS){for(const ch of RADS[k])RAD[ch]=k;}
const RADLIST=Object.keys(RADS);
function pyOf(z,p){return '<span class="py">'+esc(p)+'</span>';}
function g_zi2py(u){const it=pick(u.Z),pp=parsePy(it.p);
  const cand=[1,2,3,4].filter(t=>t!==pp.t).map(t=>mark(pp.b,t));
  const other=shuffle(ALLZ.filter(x=>parsePy(x.p).b!==pp.b))[0].p;
  const opts=[it.p].concat(shuffle(cand).slice(0,2),[other]);
  return chQ({tip:"这个字怎么读？选出正确的拼音",prompt:'<div class="qbig kai">'+it.z+'</div>',opts:opts,cls:"py small",
    sayAfter:[it.z+"，"+it.w,"zh-CN"],explain:'<b class="kai big1">'+it.z+'</b> 读 <b class="py">'+esc(it.p)+'</b>，组词：<b>'+it.w+'</b>',label:"“"+it.z+"”的读音",key:"zp:"+it.z+it.p});}
function g_py2zi(u){const it=pick(u.Z);const seen={};seen[it.p]=1;const opts=[it.z];
  const pool=shuffle(u.Z.filter(x=>x.z!==it.z)).concat(shuffle(ALLZ));
  for(const x of pool){if(opts.length>=4)break;if(seen[x.p]||opts.indexOf(x.z)>=0)continue;seen[x.p]=1;opts.push(x.z);}
  return chQ({tip:"看拼音，选出正确的字",prompt:'<div class="qmid py">'+esc(it.p)+'</div>',opts:opts,cls:"kai",
    say:[it.w,"zh-CN"],explain:'<b class="kai big1">'+it.z+'</b>（'+esc(it.p)+'）组词：<b>'+it.w+'</b>',label:"看拼音 "+it.p+" 选字",key:"pz:"+it.z+it.p});}
function g_word(u){const cands=u.Z.filter(x=>x.w.split(x.z).length===2);const it=pick(cands);
  const opts=[it.z];
  for(const x of shuffle(u.Z.concat(ALLZ))){if(opts.length>=4)break;if(opts.indexOf(x.z)>=0||it.w.indexOf(x.z)>=0)continue;if(WORDS[it.w.replace(it.z,x.z)])continue;opts.push(x.z);}
  const shown=it.w.replace(it.z,"（　）");
  return chQ({tip:"选字组词：括号里应该填哪个字？",prompt:'<div class="qmid">'+shown+'</div>',opts:opts,cls:"kai",
    sayAfter:[it.w,"zh-CN"],explain:'组词：<b>'+it.w+'</b>（'+esc(it.p)+'）',label:"选字组词："+shown,key:"wd:"+it.w});}
function g_rad(u){const cands=u.Z.filter(x=>RAD[x.z]);if(!cands.length)return g_zi2py(u);const it=pick(cands);const r=RAD[it.z];
  const opts=[r].concat(shuffle(RADLIST.filter(x=>x!==r)).slice(0,3));
  return chQ({tip:"这个字的偏旁是什么？",prompt:'<div class="qbig kai">'+it.z+'</div>',opts:opts,cls:"small",
    sayAfter:[it.z+"，"+it.w,"zh-CN"],explain:'<b class="kai big1">'+it.z+'</b> 的偏旁是 <b>'+r+'</b>，组词：'+it.w,label:"“"+it.z+"”的偏旁",key:"rd:"+it.z});}

function bankQ(u,i){const p=u.bank[i].split("|");const q=p[0],ex=p[p.length-1],opts=p.slice(1,p.length-1);
  const isPy=/^[a-zāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü]+$/.test(opts[0]);const short=opts.every(o=>o.length<=2&&!isPy);

    say:[zhSay(q),"zh-CN"],explain:esc(ex),label:q,key:"bk:"+u.id+":"+i});}

function carryAdd(a,b){return a%10+b%10>=10;}
function borrowSub(a,b){return a%10<b%10;}
function m_add(force){let a,b,n=0;const carry=force!==undefined?force:Math.random()<.75;
  do{a=rnd(10,89);b=Math.random()<.5?rnd(2,9):rnd(10,89);}while((a+b>100||carryAdd(a,b)!==carry)&&n++<300);
  return eqQ(a+"+"+b,a+b,a+" + "+b+" = <b>"+(a+b)+"</b>"+(carry?"（个位满十，向十位进1）":""));}
function m_sub(force){let a,b,n=0;const br=force!==undefined?force:Math.random()<.75;
  do{a=rnd(20,99);b=Math.random()<.5?rnd(2,9):rnd(10,a-1);}while((b>=a||borrowSub(a,b)!==br)&&n++<300);
  return eqQ(a+"-"+b,a-b,a+" − "+b+" = <b>"+(a-b)+"</b>"+(br?"（个位不够减，从十位退1）":""));}
function vert(a,op,b){return '<table class="vt"><tr><td></td><td>'+(a>9?Math.floor(a/10):"")+'</td><td>'+a%10+'</td></tr><tr><td>'+op+'</td><td>'+(b>9?Math.floor(b/10):"")+'</td><td>'+b%10+'</td></tr><tr class="line"><td colspan="3"></td></tr></table>';}
function m_vertical(){const add=Math.random()<.5;let a,b,n=0;
  do{a=rnd(12,89);b=rnd(11,79);}while((add?(a+b>100||!carryAdd(a,b)):(b>=a||!borrowSub(a,b)))&&n++<300);
  const r=add?a+b:a-b,op=add?"+":"−";
  return numQ({tip:"用竖式计算，相同数位对齐",prompt:'<div class="vwrap">'+vert(a,op,b)+'<div class="qeq small">= '+AB+'</div></div>',ans:r,say:[zhSay(a+op+b)+"等于几？","zh-CN"],
    explain:add?"个位 "+a%10+"＋"+b%10+" 满十进一，结果 <b>"+r+"</b>":"个位 "+a%10+" 不够减 "+b%10+"，从十位退1，结果 <b>"+r+"</b>",label:"竖式 "+a+" "+op+" "+b,key:"v:"+a+op+b});}

  const seen={},opts=[];for(const c of cand){const s=kj(c[0],c[1]);if(!seen[s]){seen[s]=1;opts.push(s);}if(opts.length>=4)break;}
  let a=x,b=y;if(Math.random()<.5)[a,b]=[b,a];
  return chQ({tip:"计算时用哪句口诀？",prompt:'<div class="qeq">'+a+' × '+b+'</div>',opts:opts,cls:"small",say:[zhSay(a+"×"+b)+"用哪句口诀？","zh-CN"],explain:a+" × "+b+" 用口诀 <b>"+kj(x,y)+"</b>",label:a+"×"+b+" 用哪句口诀",key:"kc:"+x+"x"+y});}

function m_apply(){const t=rnd(1,5);const k=rnd(6,9),n=rnd(2,9);
  if(t===1)return wordQ("每盒有"+k+"个鸡蛋，"+n+"盒一共有几个鸡蛋？",k*n,"个","求"+n+"个"+k+"是多少，用乘法："+k+"×"+n+"＝<b>"+k*n+"</b>（不是看到“每”就用除法）");
  if(t===2)return wordQ((k*n)+"个鸡蛋，平均放进"+n+"个盒子，每盒放几个？",k,"个","平均分，用除法："+(k*n)+"÷"+n+"＝<b>"+k+"</b>（"+kj(k,n)+"）");
  if(t===3)return wordQ((k*n)+"个鸡蛋，每盒放"+k+"个，需要几个盒子？",n,"个","求"+(k*n)+"里有几个"+k+"，用除法："+(k*n)+"÷"+k+"＝<b>"+n+"</b>（"+kj(k,n)+"）");

  const a=rnd(2,9),m=rnd(2,9);return wordQ("院子里有"+a+"只鸡，"+(a*m)+"只鸭，鸭的只数是鸡的几倍？",m,"倍","求一个数是另一个数的几倍，用除法："+(a*m)+"÷"+a+"＝<b>"+m+"</b>");}

  let k,n;do{k=rnd(2,9);n=rnd(2,9);}while(k*n>50);return wordQ("每支铅笔"+k+"元，买"+n+"支，付了50元，应找回几元？",50-k*n,"元","先算 "+k+"×"+n+"＝"+(k*n)+"元，再算 50－"+(k*n)+"＝<b>"+(50-k*n)+"</b>元");}

 else{const ab=$("#ansbox");if(ab){ab.textContent=c.ans;ab.style.color=ok?"var(--ok)":"var(--bad)";}document.querySelectorAll(".pad button").forEach(b=>b.disabled=true);}

function finishPractice(){const bonus=(Q.base>=5&&Q.okFirst===Q.base)?3:0;D.stars+=bonus;Q.stars+=bonus;Q.bonus=bonus;
 if(!Q.fromWrong){D.subj[Q.subj].rounds++;if(Q.uid)U(Q.uid).rounds++;}
 D.log.unshift({t:Date.now(),title:Q.title,n:Q.base,ok:Q.okFirst});if(D.log.length>60)D.log.length=60;save();SFX.win();setScreen("summary");confetti();}
function finishTest(){if(!Q||Q.mode!=="test"||Q.done)return;Q.done=true;clearInterval(Q.tick);Q.tick=null;
 const n=Q.items.length;let ok=0;Q.items.forEach((q,i)=>{const a=Q.answers[i];if(a&&a.ok)ok++;else addWrong(q);});
 const score=Math.round(ok*100/n),sec=(Date.now()-Q.start)/1000;const gain=Math.round(score/10);D.stars+=gain;
 (D.tests[Q.testId]||(D.tests[Q.testId]=[])).push({t:Date.now(),score:score,ok:ok,n:n,sec:Math.round(sec),timed:!!Q.limit});if(D.tests[Q.testId].length>20)D.tests[Q.testId].shift();
 D.log.unshift({t:Date.now(),title:Q.title,n:n,ok:ok});if(D.log.length>60)D.log.length=60;save();
 Q.result={score:score,ok:ok,n:n,sec:sec,gain:gain};SFX.win();setScreen("result");if(score>=80)confetti();}
